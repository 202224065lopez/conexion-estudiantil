
<div class="register-page">

  <div class="register-container">

    <div class="register-header">
      <h1>Conexión Estudiantil</h1>
      <p>Forma parte de nuestra comunidad educativa</p>
    </div>

    <div class="register-form">

      <h2>Crear una cuenta</h2>
      <p class="subtitle">Ingresa tus datos para registrarte como aspirante</p>

      <form (ngSubmit)="registrar()" #registroForm="ngForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Nombre(s)</label>
            <input
              type="text"
              name="nombres"
              [(ngModel)]="aspirante.nombres"
              placeholder="Ingresa tus nombres"
              required>
          </div>

          <div class="form-group">
            <label>Apellidos</label>
            <input
              type="text"
              name="apellidos"
              [(ngModel)]="aspirante.apellidos"
              placeholder="Ingresa tus apellidos"
              required>
          </div>

          <div class="form-group">
            <label>Correo electrónico</label>
            <input
              type="email"
              name="correo"
              [(ngModel)]="aspirante.correo_electronico"
              placeholder="ejemplo@correo.com"
              required email>
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input
              type="tel"
              name="telefono"
              [(ngModel)]="aspirante.telefono"
              placeholder="Número telefónico"
              required>
          </div>

          <div class="form-group full-width">
            <label>Carrera de interés</label>
            <select
              name="carrera"
              [(ngModel)]="aspirante.carrera_id"
              required>
              <option value="" disabled>Selecciona una carrera</option>
              @for (carrera of carreras; track carrera.id) {
                <option [value]="carrera.id">
                  {{ carrera.nombre }}
                </option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>Contraseña</label>
            <input
              type="password"
              name="contrasena"
              [(ngModel)]="aspirante.contrasena"
              placeholder="Crea una contraseña"
              required minlength="8">
          </div>

          <div class="form-group">
            <label>Confirmar contraseña</label>
            <input
              type="password"
              name="confirmar"
              [(ngModel)]="aspirante.confirmar_contrasena"
              placeholder="Confirma tu contraseña"
              required minlength="8">
          </div>

        </div>

        <button type="submit" [disabled]="registroForm.invalid">
          Crear mi cuenta
        </button>

      </form>

      <p class="login-link">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>

    </div>

  </div>

</div>
